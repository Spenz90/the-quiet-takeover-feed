name: Refresh mirror feed

# Keeps the Spotify/Apple-facing mirror of The Quiet Takeover fresh.
# Runs daily after the 6:39 AM PT episode publish, plus on demand.
on:
  schedule:
    - cron: "30 15 * * *"   # 8:30 AM PT (15:30 UTC), after the daily episode cron
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate feed.xml
        run: python3 mirror_feed.py -o feed.xml
      - name: Commit if changed
        run: |
          git config user.name "tqt-mirror-bot"
          git config user.email "tqt-mirror-bot@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || git commit -m "refresh mirror feed $(date -u +%F)"
          git push
